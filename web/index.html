<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF7EE">
  <meta name="description" content="A judgement-free community for Indian moms in Mountain View and Sunnyvale. Share, ask for advice and meet moms nearby.">
  <!-- The visible brand name comes from data.js (brand.name); this title is replaced at runtime. -->
  <title>Aangan — No judgement. Just moms.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside class="showcase" id="showcase" aria-label="About this prototype"></aside>
  <div class="phone" id="phone">
    <div class="app" id="app">
      <main class="screen" id="screen" tabindex="-1"></main>
      <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
      <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
      <div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>
  </div>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
